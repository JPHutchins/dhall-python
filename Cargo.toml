[package]
name = "dhall"
version = "0.1.17"
authors = [
    "Simon Zeng <contact@simonzeng.com>",
    "Tristan Cacqueray <tdecacqu@redhat.com>",
    "Matthias Endler <matthias-endler@gmx.net>",
]
description = "Python bindings for dhall, a functional configuration language"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/s-zeng/dhall-python"
homepage = "https://github.com/s-zeng/dhall-python"
readme = "README.md"
keywords = ["dhall", "python"]

[dependencies]
serde = "1"
serde_dhall = "0.13"
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
thiserror = "2"
openssl = { version = "0.10", features = ["vendored"] }

[lib]
name = "dhall"
crate-type = ["rlib", "cdylib"]

[features]
default = ["pyo3/extension-module"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
option_if_let_else = "allow"
single_match_else = "allow"
